<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <meta name="robots" content="noindex, nofollow">
  <title>Récupération d'accès — geoclicMédia</title>
  <style>
    body { font: 1rem/1.6 system-ui, sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; padding: 2rem 1rem; }
    main { max-width: 28rem; margin: 4vh auto; padding: 2rem; background: white; border: 1px solid #cbd5e1; border-radius: .75rem; }
    h1 { font-size: 1.5rem; line-height: 1.3; } label { display: block; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; font: inherit; padding: .65rem; border: 1px solid #64748b; border-radius: .3rem; }
    button { font: inherit; background: #1a4d6e; color: white; border: 0; padding: .75rem 1rem; border-radius: .3rem; cursor: pointer; }
    a { color: #1a4d6e; } .errorlist, [role=alert] { color: #991b1b; } .helptext { display: block; font-size: .875rem; }
  </style>
</head>
<body><main>
  <h1>Retrouver mon accès geoclicMédia</h1>
  {% block content %}{% endblock %}
  <p><a href="/admin/login">Retour à la connexion</a></p>
</main></body>
</html>
