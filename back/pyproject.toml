[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
    migrations
  | \.venv
  | staticfiles
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv", "staticfiles"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "DJ",  # django-specific
]
ignore = [
    "E501",  # line-too-long: géré par Black
]

[tool.ruff.lint.per-file-ignores]
"**/settings/*.py" = ["F405", "F403"]  # star imports tolérés en settings split
"**/__init__.py" = ["F401"]            # ré-exports

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra --strict-markers"
