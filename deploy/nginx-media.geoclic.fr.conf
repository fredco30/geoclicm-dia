# /etc/nginx/sites-available/media.geoclic.fr
# Vhost geoclicMédia — front Next.js + back Django + media

upstream geoclicmedia_django {
    server 127.0.0.1:8002 fail_timeout=0;
}

upstream geoclicmedia_next {
    server 127.0.0.1:3001 fail_timeout=0;
}

# Redirige HTTP → HTTPS (sera complété par certbot)
server {
    listen 80;
    listen [::]:80;
    server_name media.geoclic.fr;

    # Acme challenge Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Le reste : redirect HTTPS (sera ajouté automatiquement par certbot)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.geoclic.fr;

    # SSL — sera rempli par certbot
    # ssl_certificate /etc/letsencrypt/live/media.geoclic.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/media.geoclic.fr/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Sécurité headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Logs
    access_log /var/log/nginx/geoclicmedia-access.log;
    error_log  /var/log/nginx/geoclicmedia-error.log;

    # Tailles de body (uploads)
    client_max_body_size 10M;

    # === Django : admin + API ===
    location ~ ^/(admin|api|static|healthz)(/|$) {
        proxy_pass http://geoclicmedia_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # === Media files (uploads) — servis directement par Nginx ===
    location /media/ {
        alias /var/www/geoclicmedia/back/mediafiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # === Next.js : tout le reste ===
    location / {
        proxy_pass http://geoclicmedia_next;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # Static Next.js (._next/static) — long cache
    location /_next/static/ {
        proxy_pass http://geoclicmedia_next;
        proxy_cache_valid 200 1y;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
