name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    name: Django (tests + migrations)
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-not-secret
      DB_NAME: geoclicmedia_ci
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: 127.0.0.1
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 16 + PostGIS + pgvector + GDAL
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            postgresql-16 postgresql-16-postgis-3 postgresql-16-pgvector gdal-bin libgdal-dev
          sudo pg_ctlcluster 16 main start
          sudo -u postgres psql -qc "CREATE ROLE ci LOGIN SUPERUSER PASSWORD 'ci';"
          sudo -u postgres createdb -O ci geoclicmedia_ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest -q -p no:cacheprovider

  front:
    name: Next.js (types, lint, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: front
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # API injoignable au build : les pages retombent sur leurs valeurs vides.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
